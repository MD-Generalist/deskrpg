name: Office image

# deskrpg-office — 사무실(DeskRPG)과 두뇌(Hermes Agent)를 한 컨테이너에 담은 이미지.
#
# release.yml 과 분리한 이유: 이 이미지는 DeskRPG 릴리스가 아니라 `deskrpg@latest` 와
# 공식 Hermes 이미지를 바탕에 깔고 굽는다. 그래서 릴리스 태그로도, 손으로도 구울 수 있어야
# 한다(공식 Hermes 가 올라갔을 때 릴리스 없이 다시 굽는 경우).
#
# amd64 전용이다. 공식 Hermes 이미지의 arm64 변종은 2026-06 버전에 멈춰 있어(실측 v0.16.0)
# 플러그인이 로드되지 않는다. 대상은 amd64 VPS 다.
on:
  push:
    tags: ["20[0-9][0-9].[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 태그 (예: 2026.9.20). 비우면 latest 만 민다."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: office-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dandacompany/deskrpg-office

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: meta
        # 입력값은 쉘 코드가 아니라 환경변수로 넣는다(스크립트 주입 방지).
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$INPUT_VERSION"
          case "$V" in
            "" ) ;;
            20[0-9][0-9].[0-9]*.[0-9]* ) ;;
            * ) echo "version 은 날짜 태그 형식이어야 합니다: $V" >&2; exit 1 ;;
          esac
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; fi
          TAGS="$IMAGE:latest"
          [ -n "$V" ] && TAGS="$TAGS,$IMAGE:$V"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/office
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
      # 익명으로 당길 수 있어야 Compose 기본값으로 쓸 수 있다.
      - name: Verify anonymous pull
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TOK="$(curl -sf "https://ghcr.io/token?scope=repository:dandacompany/deskrpg-office:pull&service=ghcr.io" | jq -r .token)"
          for ref in latest $VERSION; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/dandacompany/deskrpg-office/manifests/$ref")"
            echo "$ref -> HTTP $code"
            [ "$code" = "200" ] || { echo "$ref 를 익명으로 당길 수 없습니다. 패키지 공개 설정을 확인하세요." >&2; exit 1; }
          done
