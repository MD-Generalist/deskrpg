name: Release

# 날짜 태그(YYYY.M.D)를 밀면 npm → Docker Hub → GitHub Release 를 한 번에 낸다.
# 사람이 하는 일은 버전 커밋과 `git push origin <tag>` 뿐이다.
#
# 필요한 시크릿:
#   NPM_TOKEN            — npmjs granular token(publish, 패키지 deskrpg). --provenance 로 서명한다.
#   DOCKERHUB_USERNAME   — 이미 등록됨
#   DOCKERHUB_TOKEN      — 이미 등록됨
on:
  push:
    tags: ["20[0-9][0-9].[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: dandacompany/deskrpg

jobs:
  # 태그와 package.json 이 다르면 아무것도 내보내지 않는다.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "태그($TAG)와 package.json($PKG)이 다릅니다. 버전 커밋을 먼저 미세요." >&2
            exit 1
          fi
          for f in README.md README.ko.md src/app/game/GamePageClient.tsx; do
            grep -q "$PKG" "$f" || { echo "$f 에 $PKG 가 없습니다." >&2; exit 1; }
          done
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm --provenance (Sigstore OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepack 이 next build 를 돈다 — 여기서 따로 빌드하지 않는다.
      - name: Publish deskrpg@${{ needs.verify.outputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="${{ needs.verify.outputs.version }}"
          if npm view "deskrpg@$V" version >/dev/null 2>&1; then
            echo "deskrpg@$V 는 이미 발행돼 있어 건너뜁니다."
          else
            npm publish --provenance --access public
          fi
      - name: Wait for registry propagation
        run: |
          V="${{ needs.verify.outputs.version }}"
          for i in $(seq 1 24); do
            npm view "deskrpg@$V" version >/dev/null 2>&1 && { echo "propagated after $i"; exit 0; }
            sleep 5
          done
          echo "registry never propagated" >&2; exit 1

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # amd64 + arm64 둘 다 — arm64 만 올리면 Intel 사용자가 exec format error 를 본다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both platforms
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ needs.verify.outputs.version }}" | grep -E "Platform:\s+linux/(amd64|arm64)" | tee /tmp/platforms
          [ "$(wc -l < /tmp/platforms)" -ge 2 ]

  github-release:
    needs: [verify, npm, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release notes
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## DeskRPG $V"
            echo
            echo "### Changes"
            if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..${GITHUB_REF_NAME}"; else git log --no-merges --pretty='- %s' -n 30; fi
            echo
            echo "### Install"
            echo '```'
            echo "npm install -g deskrpg@$V"
            echo "docker pull dandacompany/deskrpg:$V   # linux/amd64 + linux/arm64"
            echo '```'
            echo
            echo "- npm: https://www.npmjs.com/package/deskrpg/v/$V (provenance signed)"
            echo "- Docker Hub: https://hub.docker.com/r/dandacompany/deskrpg/tags?name=$V"
          } > /tmp/notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.verify.outputs.version }}
        run: gh release create "$V" --title "DeskRPG $V" --notes-file /tmp/notes.md --verify-tag
