name: CI

on:
  push:
    branches: [master]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다 — 오래된 결과를 기다릴 이유가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 마이그레이션 테스트(src/db/npc-profile-migration.test.ts)는 임시 PostgreSQL 이
    # 있을 때만 돈다. 그 서비스가 없어서 이 테스트는 어디서도 실행되지 않았고,
    # 스위트는 skipped 1 로 초록이었다 — 프로덕션이 PostgreSQL 이고 NPC 삭제·백필이
    # 걸린 곳이 바로 이 마이그레이션인데도.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deskrpg
          POSTGRES_PASSWORD: migtest
          POSTGRES_DB: deskrpg
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U deskrpg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: 공개 트리 메타 파일 검사
        run: bash scripts/check-public-tree.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 실패해도 나머지를 계속 돌린다 — 한 번에 무엇이 깨졌는지 전부 보이는 편이
      # "고치고 다시 밀고 다음 실패를 본다"를 반복하는 것보다 싸다.
      - name: 단위 테스트
        if: always()
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://deskrpg:migtest@127.0.0.1:55437/deskrpg
        run: npm run test

      - name: 타입 검사
        if: always()
        run: npm run typecheck

      # 2026-09-07 에 0으로 만들었다. 이 단계가 없는 동안 react-hooks/exhaustive-deps
      # 위반 17건이 타일 에디터에 살아 있었고, 그중 여럿이 실제 결함이었다
      # (레이어 오버레이 토글이 캔버스를 다시 그리지 않는 등).
      #
      # 경고(미사용 변수 등)로는 실패하지 않는다 — 오류만 게이트다. 경고까지 막으려면
      # 먼저 그것들을 0으로 만들어야 하고, 그건 별개의 작업이다.
      - name: 린트
        if: always()
        run: npm run lint

      # 이 저장소에서 가장 값진 게이트다. 없는 모듈을 import 하는 코드가 넉 달을
      # 살아남은 적이 있다(ec60ca2d) — 단위 테스트는 그 라우트를 import 하지 않고,
      # dev 서버는 요청된 라우트만 컴파일하므로 전체 빌드만이 그걸 본다.
      - name: 빌드
        if: always()
        run: npm run build

      - name: 포매팅
        if: always()
        run: npm run format:check

  game-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:fixtures
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: game-fixture-traces
          path: .artifacts/game-fixtures/test-results
          include-hidden-files: true
          retention-days: 7

  # 런타임 이미지가 실제로 빌드되는지 본다.
  #
  # verify 잡으로는 이 층을 못 본다. 단위 테스트는 .ts 소스를 직접 읽으므로 파일이
  # 다 있고, `next build` 는 앱을 번들할 뿐 Dockerfile 의 COPY 목록과 무관하다.
  # 그래서 삭제된 파일을 계속 COPY 하던 Dockerfile 이 넉 달을 살아남았고, 2단계에서
  # 늘어난 런타임 모듈이 통째로 빠진 것도 배포 때서야 드러났다.
  #
  # 러너는 amd64 이고 배포 대상(MiniPC)도 x86_64 라 아키텍처가 맞는다.
  # master 푸시에서는 같은 빌드 결과를 GHCR 에 SHA 태그로 올린다. 이는 운영 후보일
  # 뿐 배포가 아니다. 운영 전환은 verify 와 docker 가 모두 초록일 때 별도 수행한다.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: 공개 트리 메타 파일 검사
        run: bash scripts/check-public-tree.sh

      - uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인 (master 푸시만)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 런타임 이미지 빌드
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/dandacompany/deskrpg:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 운영 후보 익명 pull 확인
        if: github.event_name == 'push'
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "ghcr.io/dandacompany/deskrpg:sha-${GITHUB_SHA}" > /dev/null
