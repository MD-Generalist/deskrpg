# docker-compose.yml — DeskRPG + Hermes, one VPS, one file.
# Why each rule below exists (all measured on Hostinger): deploy/hostinger/README.md
#
# - Stay at the REPO ROOT: Docker Manager deploys the root file whatever URL path you give.
# - Stay under 8192 characters: the Docker Manager API rejects longer compose content.
# - `.env.example` must stay comment-free: Hostinger copies it verbatim into the
#   Environment box, where `# FOO` is an invalid variable name.
# - Deploy Hostinger's Traefik first. Both Traefik shapes work: host mode (no network)
#   and bridge mode on a `traefik-proxy` network. Do NOT declare `traefik-proxy` as a
#   network here — `external: true` breaks host mode, a Compose-created one breaks
#   bridge mode. `traefik-connect` joins it at runtime instead.
# - After changing anything, run `docker compose up -d` with no service name so the
#   connector runs again; `up -d deskrpg` alone leaves bridge-mode Traefik unroutable.
#
# Environment (every variable has a default, an empty box boots):
#   HERMES_API_KEY    bearer key for the bundled Hermes API server (set this one)
#   JWT_SECRET        leave as-is: the app generates one into `deskrpg-data`; yours wins
#   OPENROUTER_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY — optional; Hermes boots without
#                     them. An OpenAI key alone is ignored until `model.provider=openai-api`.
#                     ChatGPT login (`hermes auth add openai-codex`) needs none.
#   TRAEFIK_HOST      srvNNNNNN.hstgr.cloud — the app answers on deskrpg.<TRAEFIK_HOST>
#   DESKRPG_IMAGE     override the image tag (default pinned below)
#
# Local PostgreSQL stack: docker/docker-compose.dev.yml. Hermes elsewhere? Delete the
# `hermes` service and add your own gateway in DeskRPG → My Gateways.

services:
  deskrpg:
    image: ${DESKRPG_IMAGE:-ghcr.io/dandacompany/deskrpg:2026.917.1}
    restart: unless-stopped
    depends_on:
      - hermes
    environment:
      DB_TYPE: sqlite
      SQLITE_PATH: /app/data/deskrpg.db
      # 홈을 볼륨에 둔다. 컨테이너 안이면 Update 때마다 생성된 JWT_SECRET 이 사라져
      # 전원 로그아웃되고 저장된 게이트웨이 토큰을 복호화하지 못한다.
      DESKRPG_HOME: /app/data/home
      # 기본값 금지: 박아 두면 모든 설치가 같은 공개 키로 서명한다. 비면 런타임이 만든다.
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INTERNAL_HOSTNAME: 0.0.0.0
      # Only the DeskRPG server host may run the gateway setup wizard; keep it off on a VPS
      # unless you explicitly intend to authorize host-level setup operations.
      DESKRPG_HOST_SETUP_ENABLED: ${DESKRPG_HOST_SETUP_ENABLED:-0}
    volumes:
      - deskrpg-data:/app/data
    labels:
      - traefik.enable=true
      # Bridge-mode Traefik must dial the `traefik-proxy` IP, not the project network one.
      - traefik.docker.network=traefik-proxy
      # Socket.IO lives on an internal second port (3001). Route only /socket.io there;
      # everything else goes to Next.js on 3000. Same-origin, so the browser needs no config.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.rule=Host(`${COMPOSE_PROJECT_NAME:-deskrpg}.${TRAEFIK_HOST:-localhost}`) && PathPrefix(`/socket.io`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.priority=20
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.service=${COMPOSE_PROJECT_NAME:-deskrpg}-ws
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.loadbalancer.server.port=3001
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.rule=Host(`${COMPOSE_PROJECT_NAME:-deskrpg}.${TRAEFIK_HOST:-localhost}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.priority=10
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.service=${COMPOSE_PROJECT_NAME:-deskrpg}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-deskrpg}.loadbalancer.server.port=3000

  # One-shot: join `deskrpg` to `traefik-proxy` when a bridge-mode Traefik made it.
  # The socket is read-write (`network connect` writes) — host-root equivalent, so it
  # runs only this fixed script and exits. Reads its own project label, so any
  # project name works.
  traefik-connect:
    image: docker:29-cli
    restart: "no"
    depends_on:
      - deskrpg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        docker network inspect traefik-proxy >/dev/null 2>&1 || { echo "traefik-proxy not found (host-mode Traefik or none): nothing to do"; exit 0; }
        project=$$(docker inspect "$$HOSTNAME" --format '{{ index .Config.Labels "com.docker.compose.project" }}')
        [ -n "$$project" ] || { echo "cannot read own compose project label"; exit 1; }
        for id in $$(docker ps -q --filter "label=com.docker.compose.project=$$project" --filter label=com.docker.compose.service=deskrpg); do
          if docker network connect traefik-proxy "$$id" 2>/tmp/err; then echo "joined traefik-proxy: $$id"
          elif grep -qi "already exists" /tmp/err; then echo "already on traefik-proxy: $$id"
          else cat /tmp/err; exit 1; fi
        done

  # Bundled Hermes Agent gateway + OpenAI-compatible API server (what DeskRPG talks to).
  # Reachable from DeskRPG at http://hermes:8642 — never published to the internet.
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-change-this-hermes-api-key}
      # Pick ONE provider and set its key in Docker Manager. Empty values are ignored by Hermes.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - hermes-data:/opt/data
    networks:
      - default

volumes:
  deskrpg-data:
  hermes-data:
