# docker-compose.yml — DeskRPG + Hermes, one VPS, one file.
#
# This file must stay at the REPO ROOT. Hostinger's Docker Manager resolves a
# GitHub URL to the repo's root docker-compose.yml regardless of which path the
# URL points at — measured 2026-09-16: a raw URL for
# `deploy/hostinger/docker-compose.yml` deployed this root file instead. Moving
# it back into a subdirectory silently breaks one-click deploy.
#
# Hostinger also pre-fills the Environment box from the repo-root `.env.example`
# **verbatim**, and it has no comment syntax: a line starting with `#` becomes a
# variable named `# FOO` and is rejected as invalid. Keep `.env.example` free of
# comments; the prose lives in `ENVIRONMENT.md`.
#
# DEPLOY TRAEFIK FIRST. The `traefik-proxy` network below is `external: true`,
# so `docker compose up` fails outright when that network does not exist yet —
# and Hostinger reports it only as a project stuck at `created` whose logs say
# "Docker project not found", which names neither Traefik nor the network.
# Measured 2026-09-16. hPanel offers the Traefik project right on the Docker
# Manager page ("Enable HTTPS for Docker projects"); deploy that once, then this.
#
# `external: true` is deliberate — Hostinger's catalog Traefik owns that network
# and we are a guest on it. Dropping `external` so this file creates the network
# breaks the opposite case: Compose refuses to adopt a network it did not create
# ("incorrect label com.docker.compose.network"), so every user who installed
# Traefik first would fail instead. There is no single setting that serves both.
#
# Deploy: hPanel → VPS → Docker Manager → Compose → "Compose from URL", or the
# "Deploy on Hostinger" button in README.md.
#
# Shape this file keeps:
#   - `image:` only, no `env_file:`, no `version:`, every variable has a default
#     so an empty Environment box still boots
#   - app ports are not published; Traefik (Hostinger catalog project) terminates HTTPS
#   - SQLite, not Postgres — data lives in the named volume `deskrpg-data`
#
# Environment variables (all optional; defaults boot as-is):
#   JWT_SECRET        long random string  (REQUIRED for production — default is a placeholder)
#   HERMES_API_KEY    bearer key for the bundled Hermes API server (REQUIRED if you use `hermes`)
#   OPENROUTER_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY — model provider for Hermes.
#                     Without one the gateway never starts and employees simply stay silent.
#   TRAEFIK_HOST      injected by Hostinger when the Traefik project exists (srvNNNNNN.hstgr.cloud)
#   DESKRPG_IMAGE     override the image tag (default pinned below)
#
# Local development with PostgreSQL instead: `docker/docker-compose.dev.yml`.
#
# Already have Hermes somewhere else? Delete the `hermes` service and point
# DeskRPG → My Gateways → New gateway at your own API server URL + profile key.

services:
  deskrpg:
    image: ${DESKRPG_IMAGE:-ghcr.io/dandacompany/deskrpg:2026.916.1}
    restart: unless-stopped
    depends_on:
      - hermes
    environment:
      DB_TYPE: sqlite
      SQLITE_PATH: /app/data/deskrpg.db
      # 런타임 홈을 데이터 볼륨 안에 둔다. 기본값(`~/.deskrpg`)은 컨테이너 파일시스템이라
      # Update 로 컨테이너를 재생성할 때마다 자동 생성된 JWT_SECRET 이 사라진다 — 그러면
      # 접속자 전원이 로그아웃되고 저장된 게이트웨이 토큰을 복호화하지 못한다.
      DESKRPG_HOME: /app/data/home
      # 기본값을 두지 않는다. 값을 박아 두면 손대지 않은 설치가 전부 같은 공개 키로
      # 세션 토큰을 서명한다. 비어 있으면 진입점이 unset 하고 런타임이 키를 만들어
      # 데이터 볼륨에 보관한다(docker-entrypoint.sh).
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      INTERNAL_HOSTNAME: 0.0.0.0
      # Only the DeskRPG server host may run the gateway setup wizard; keep it off on a VPS
      # unless you explicitly intend to authorize host-level setup operations.
      DESKRPG_HOST_SETUP_ENABLED: ${DESKRPG_HOST_SETUP_ENABLED:-0}
    volumes:
      - deskrpg-data:/app/data
    networks:
      - default
      - traefik-proxy
    labels:
      - traefik.enable=true
      # Socket.IO lives on an internal second port (3001). Route only /socket.io there;
      # everything else goes to Next.js on 3000. Same-origin, so the browser needs no config.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.rule=Host(`${COMPOSE_PROJECT_NAME:-deskrpg}.${TRAEFIK_HOST:-localhost}`) && PathPrefix(`/socket.io`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.priority=20
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.service=${COMPOSE_PROJECT_NAME:-deskrpg}-ws
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-deskrpg}-ws.loadbalancer.server.port=3001
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.rule=Host(`${COMPOSE_PROJECT_NAME:-deskrpg}.${TRAEFIK_HOST:-localhost}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.priority=10
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-deskrpg}.service=${COMPOSE_PROJECT_NAME:-deskrpg}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-deskrpg}.loadbalancer.server.port=3000

  # Bundled Hermes Agent gateway + OpenAI-compatible API server (what DeskRPG talks to).
  # Reachable from DeskRPG at http://hermes:8642 — never published to the internet.
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:-change-this-hermes-api-key}
      # Pick ONE provider and set its key in Docker Manager. Empty values are ignored by Hermes.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - hermes-data:/opt/data
    networks:
      - default

volumes:
  deskrpg-data:
  hermes-data:

networks:
  traefik-proxy:
    external: true
